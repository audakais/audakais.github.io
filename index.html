<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auda Kais</title>
  <meta name="description" content="Auda Kais — projects.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <a class="bar__home" href="#top">ak<span class="caret">_</span></a>
    <nav class="bar__nav">
      <a href="#projects">projects</a>
      <a href="#contact">contact</a>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <img class="hero__img" src="assets/arno.jpg" alt="">
      <div class="hero__shade"></div>
      <span class="corner"></span>

      <pre class="hero__code" aria-hidden="true" id="hero-code"></pre>

      <div class="hero__text">
        <h1 id="name"></h1>
        <p class="hero__role" id="role"></p>
      </div>
      <p class="hero__coords" id="coords"></p>
    </section>

    <section class="projects" id="projects">
      <div class="section-head">
        <h2>Projects</h2>
        <span class="count" id="count"></span>
      </div>
      <ol class="plist" id="plist"></ol>
    </section>

    <figure class="band">
      <img src="assets/gazometro.jpg" alt="Gazometro, Ostiense, Rome" loading="lazy">
    </figure>

    <section class="contact" id="contact">
      <div class="contact__links">
        <h2>Contact</h2>
        <ul id="links"></ul>
      </div>
      <img class="contact__img" src="assets/eur.jpg" alt="Palazzo della Civiltà Italiana at sunset, EUR, Rome" loading="lazy">
    </section>
  </main>

  <footer class="foot">
    <span id="foot-name"></span>
    <span id="foot-place"></span>
  </footer>

  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
</html>
