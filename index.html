<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auda Kais</title>
  <meta name="description" content="Auda Kais — machine learning and data.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav">
    <div class="wrap nav__in">
      <a class="nav__name" href="./">Auda Kais</a>
      <nav class="nav__links">
        <a href="#work">Work</a>
        <a href="#contact">Contact</a>
        <a class="btn btn--sm" id="nav-cta" target="_blank" rel="noopener">Get in touch</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero wrap">
      <p class="eyebrow" id="place"></p>
      <h1 class="hero__title" id="headline"></h1>
      <p class="hero__role" id="role"></p>
      <div class="hero__cta">
        <a class="btn" id="cta-primary" target="_blank" rel="noopener">Get in touch <span aria-hidden="true">→</span></a>
        <a class="btn btn--ghost" id="cta-github" target="_blank" rel="noopener">GitHub</a>
      </div>
    </section>

    <section class="work wrap" id="work">
      <div class="section-head">
        <h2>Selected work</h2>
      </div>
      <div class="cards" id="projects"></div>
    </section>

    <section class="contact wrap" id="contact">
      <h2 class="contact__title">Let’s talk.</h2>
      <p class="contact__sub">Open to conversations about machine learning, data and new ventures.</p>
      <ul class="contact__links" id="links"></ul>
    </section>
  </main>

  <footer class="foot wrap">
    <span>Auda Kais</span>
    <span id="foot-year"></span>
  </footer>

  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
</html>
